name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Installs Node and the Bun version pinned in package.json#packageManager.
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version: "24"
          cache: true

      - name: Install
        run: vp install --frozen-lockfile

      - name: Format and lint
        run: vp check

      - name: Type-check (tsc, the compiler that emits types/)
        run: vp exec bun run typecheck

      - name: Test (boundary, committed types, tests, example)
        run: vp exec bun run test

      - name: Check the package content
        run: vp exec bash scripts/check-package.sh

  commitlint:
    name: Conventional Commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version: "24"
          cache: true

      - name: Install
        run: vp install --frozen-lockfile

      - name: Lint the pull request commits
        env:
          FROM: ${{ github.event.pull_request.base.sha }}
          TO: ${{ github.event.pull_request.head.sha }}
        run: vp exec commitlint --from "$FROM" --to "$TO" --verbose

      # A squash merge commits the pull request title: it must be a Conventional Commit too.
      - name: Lint the pull request title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$TITLE" | vp exec commitlint --verbose

  workflows:
    name: Workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up workflow linters (versions from mise.toml)
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: actionlint zizmor

      - name: Lint and audit GitHub Actions
        run: |
          actionlint -color
          zizmor --min-severity medium .github/workflows
