name: Release

# Dispatched from main once the release pull request (`bun scripts/release.ts prepare X.Y.Z`,
# commit `chore(release): X.Y.Z`) is merged. Validates that package.json and CHANGELOG.md agree,
# runs the full gate, publishes to GitHub Packages, then creates the `vX.Y.Z` tag and the GitHub
# Release whose body is the changelog section. Every publishing step is idempotent: re-run a
# failed run (`gh run rerun <id> --failed`) rather than dispatching again.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (X.Y.Z or X.Y.Z-prerelease), equal to package.json#version
        required: true
        type: string
      dry_run:
        description: Validate and run the gate only; publish nothing, tag nothing
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  RELEASE_VERSION: ${{ inputs.version }}
  PACKAGE_NAME: "@ovarilo/csms-drivers"
  REGISTRY: https://npm.pkg.github.com

jobs:
  validate:
    name: Validate and gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version: "24"
          cache: true

      - name: Install
        run: vp install --frozen-lockfile

      - name: Validate version, package.json and changelog
        run: |
          set -euo pipefail
          [[ "${GITHUB_REF}" == "refs/heads/main" ]] || { echo "Releases run from main only" >&2; exit 1; }
          package_version="$(node -p 'require("./package.json").version')"
          [[ "${package_version}" == "${RELEASE_VERSION}" ]] \
            || { echo "package.json is ${package_version}, not ${RELEASE_VERSION}: merge the release pull request first" >&2; exit 1; }
          vp exec bun scripts/release.ts notes "${RELEASE_VERSION}" > /dev/null

      - name: Check the tag is free or already on this commit
        run: |
          set -euo pipefail
          tag="v${RELEASE_VERSION}"
          remote="$(git ls-remote --tags origin "refs/tags/${tag}^{}" | awk '{print $1}')"
          [[ -n "${remote}" ]] || remote="$(git ls-remote --tags origin "refs/tags/${tag}" | awk '{print $1}')"
          if [[ -n "${remote}" && "${remote}" != "${GITHUB_SHA}" ]]; then
            echo "Tag ${tag} already points to ${remote}, not ${GITHUB_SHA}" >&2
            exit 1
          fi

      - name: Format and lint
        run: vp check

      - name: Type-check
        run: vp exec bun run typecheck

      - name: Test
        run: vp exec bun run test

      - name: Check the package content
        run: vp exec bash scripts/check-package.sh

  publish:
    name: Publish to GitHub Packages
    needs: validate
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version: "24"

      - name: Publish unless already published
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          npmrc="${RUNNER_TEMP}/.npmrc"
          {
            echo "@ovarilo:registry=${REGISTRY}"
            echo "//npm.pkg.github.com/:_authToken=\${NODE_AUTH_TOKEN}"
          } > "${npmrc}"
          export NPM_CONFIG_USERCONFIG="${npmrc}"
          if npm view "${PACKAGE_NAME}@${RELEASE_VERSION}" version --registry "${REGISTRY}" > /dev/null 2>&1; then
            echo "${PACKAGE_NAME}@${RELEASE_VERSION} is already published"
            exit 0
          fi
          tag=latest
          [[ "${RELEASE_VERSION}" != *-* ]] || tag=next
          npm publish --ignore-scripts --tag "${tag}"

  release:
    name: Tag and GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version: "24"

      - name: Create the tag and the GitHub Release unless they exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v${RELEASE_VERSION}"
          if gh release view "${tag}" > /dev/null 2>&1; then
            echo "Release ${tag} already exists"
            exit 0
          fi
          notes="${RUNNER_TEMP}/release-notes.md"
          vp exec bun scripts/release.ts notes "${RELEASE_VERSION}" > "${notes}"
          prerelease=()
          [[ "${RELEASE_VERSION}" != *-* ]] || prerelease=(--prerelease)
          gh release create "${tag}" --target "${GITHUB_SHA}" --title "${tag}" --notes-file "${notes}" "${prerelease[@]}"
