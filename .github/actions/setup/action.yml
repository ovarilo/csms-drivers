name: Setup
description: Node, the Bun version pinned in package.json#packageManager, and the locked dependencies.

runs:
  using: composite
  steps:
    - name: Setup Vite+
      uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
      with:
        node-version: "26"
        cache: true

    - name: Install
      shell: bash
      run: vp install --frozen-lockfile
