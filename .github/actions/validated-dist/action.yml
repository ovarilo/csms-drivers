name: Validated dist
description: Puts the dist/ uploaded by the release gate into this checkout and fails unless the package packs to the integrity the gate validated.

inputs:
  integrity:
    description: The pack integrity recorded by the release gate (validate job output).
    required: true

runs:
  using: composite
  steps:
    - name: Download the validated build
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: dist
        path: dist/

    - name: Check the package is the validated one
      shell: bash
      env:
        VALIDATED: ${{ inputs.integrity }}
      run: |
        set -euo pipefail
        vp exec bun scripts/check-package.ts
        integrity="$(npm pack --dry-run --json --ignore-scripts | jq -er '.[0].integrity')"
        if [[ -z "${VALIDATED}" || "${integrity}" != "${VALIDATED}" ]]; then
          echo "The package packs to ${integrity}, not to the validated '${VALIDATED}': re-run all jobs" >&2
          exit 1
        fi
        echo "Package matches the validated build: ${integrity}"
